name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Build, lint and ztest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build base toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          tags: stm32-dev:latest
          load: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Build Zephyr toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BASE_IMAGE=stm32-dev:latest
          tags: stm32-dev-zephyr:latest
          load: true
          cache-from: type=gha,scope=zephyr
          cache-to: type=gha,mode=max,scope=zephyr

      - name: Build firmware
        run: make build

      - name: Static analysis (strict)
        run: make lint-strict

      - name: HWLINK ztest on native_sim
        run: make test

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: app-c-zephyr-image
          path: |
            build/zephyr-app.img
            build/zephyr-app.elf
            build/zephyr-app.map
          if-no-files-found: error
